name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  dashboard:
    name: Dashboard (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard

    strategy:
      matrix:
        node-version: [20, 22, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm run test -- --ci

      - name: Build
        run: npm run build

  contracts:
    name: Solidity Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/solidity

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Run Forge tests
        run: forge test -vvv

      - name: Gas snapshot
        run: forge snapshot

  stylus:
    name: Stylus (Rust) Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/stylus

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/stylus/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('contracts/stylus/Cargo.lock') }}

      - name: Build WASM
        run: cargo build --release --target wasm32-unknown-unknown

      - name: Run tests
        run: cargo test --features stylus-test
